<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" className="w-auto h-full">
  <defs>
    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2575FC" />
      <stop offset="50%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#00359E" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="badgeGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Inner Border Gradient -->
    <linearGradient id="badgeBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Vitrine Text Gradient (Metallic White) -->
    <linearGradient id="vitrineTextGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- CARS Text Gradient (Vibrant Cyan-Blue) -->
    <linearGradient id="carsTextGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0070F3" flood-opacity="0.45" />
    </filter>

    <filter id="dividerGlow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Left Icon Badge -->
  <g filter="url(#badgeGlow)">
    <!-- Outer Rounded Square -->
    <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="2" />
    
    <!-- Top-Left Glass Highlight -->
    <path d="M 8 30 C 8 17.85 17.85 8 30 8 L 70 8 C 82.15 8 92 17.85 92 30 L 92 36 L 22 92 L 14 92 C 10.69 92 8 89.31 8 86 Z" fill="url(#badgeGlass)" clip-path="url(#badgeClip)" />
    
    <!-- Car Silhouette -->
    <!-- Front and Rear Wheels -->
    <circle cx="36" cy="57" r="5" fill="#FFFFFF" />
    <circle cx="64" cy="57" r="5" fill="#FFFFFF" />
    <circle cx="36" cy="57" r="2" fill="#0052D4" />
    <circle cx="64" cy="57" r="2" fill="#0052D4" />

    <!-- Car Body Line Outline -->
    <path
      d="M 23 56 
         L 28 56 
         A 7.5 7.5 0 0 1 43.5 56 
         L 56.5 56 
         A 7.5 7.5 0 0 1 72 56 
         L 77 56 
         Q 79 53 78 48 
         L 67 46 
         L 55 35 
         Q 46 34 38 35 
         L 29 45 
         L 23 47 
         Q 21 51 23 56 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Divider Line -->
  <line x1="108" y1="22" x2="108" y2="78" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#dividerGlow)" />

  <!-- Typography -->
  <!-- "VITRINE" -->
  <text
    x="120"
    y="65"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="48"
    letter-spacing="-1.5"
    fill="url(#vitrineTextGrad)"
  >VITRINE</text>

  <!-- "CARS" -->
  <text
    x="300"
    y="65"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="48"
    letter-spacing="-1.5"
    fill="url(#carsTextGrad)"
  >CARS</text>
</svg>
