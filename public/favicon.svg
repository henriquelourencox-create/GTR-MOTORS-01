<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gtrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A2A" />
      <stop offset="100%" stop-color="#D50104" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D50104" />
      <stop offset="100%" stop-color="#330000" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gtrGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Red Racing Diagonal Stripe Accent -->
  <path d="M44 6 L56 6 L38 58 L26 58 Z" fill="#D50104" opacity="0.25" />
  <path d="M50 6 L58 6 L44 58 L36 58 Z" fill="#D50104" opacity="0.4" />

  <!-- Speed Dash lines -->
  <rect x="8" y="14" width="8" height="3" rx="1.5" fill="#D50104" />
  <rect x="6" y="20" width="6" height="2" rx="1" fill="#FFFFFF" opacity="0.6" />

  <!-- GTR Main Emblem text -->
  <g transform="skewX(-12) translate(10, 0)">
    <!-- GT in Pure White -->
    <text x="5" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" letter-spacing="-1">GT</text>
    <!-- R in Vivid Racing Red -->
    <text x="36" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="25" fill="url(#redGrad)" letter-spacing="-1">R</text>
  </g>

  <!-- MOTORS text pill below -->
  <rect x="12" y="46" width="40" height="9" rx="3" fill="#D50104" />
  <text x="32" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Outfit', sans-serif" font-weight="900" font-size="6.5" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">MOTORS</text>
</svg>
